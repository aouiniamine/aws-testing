<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPC + EC2 Architecture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    #canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <svg id="canvas" viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
      </marker>
      <marker id="arr-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
      </marker>
      <marker id="arr-r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
      </marker>
      <marker id="arr-p" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#7c3aed"/>
      </marker>
      <filter id="sh" x="-2%" y="-2%" width="104%" height="108%">
        <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.06"/>
      </filter>
    </defs>

    <!-- Title -->
    <text x="600" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#1e293b">VPC + EC2 Architecture</text>
    <text x="600" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Multi-AZ Public/Private Subnet Tiers &mdash; floci Local Emulation</text>

    <!-- Internet -->
    <rect x="510" y="68" width="180" height="40" rx="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
    <text x="600" y="93" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#475569">Internet</text>
    <line x1="600" y1="108" x2="600" y2="140" stroke="#475569" stroke-width="1.3" marker-end="url(#arr)"/>

    <!-- VPC boundary -->
    <rect x="55" y="140" width="1090" height="650" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="80" y="162" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#94a3b8">VPC 10.100.0.0/16</text>

    <!-- IGW -->
    <rect x="530" y="140" width="140" height="36" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3" filter="url(#sh)"/>
    <text x="600" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#2563eb">Internet Gateway</text>

    <!-- Public Route Table -->
    <rect x="475" y="200" width="250" height="32" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1" filter="url(#sh)"/>
    <text x="600" y="221" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="500" fill="#16a34a">Public Route Table (shared) &mdash; 0.0.0.0/0 &rarr; IGW</text>
    <line x1="600" y1="176" x2="600" y2="200" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>

    <!-- =============== AZ-a =============== -->
    <rect x="90" y="255" width="450" height="340" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
    <text x="110" y="275" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#94a3b8">AZ-a</text>

    <!-- Public Subnet AZ-a -->
    <rect x="110" y="285" width="410" height="120" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <text x="130" y="305" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#15803d">Public Subnet 10.100.0.0/24</text>

    <!-- public-ec2 AZ-a -->
    <rect x="130" y="315" width="140" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#sh)"/>
    <text x="200" y="332" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#15803d">public-ec2</text>
    <text x="200" y="347" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7.5" fill="#4ade80">SG: allow_all</text>

    <!-- NAT Gateway AZ-a (inside public subnet) -->
    <rect x="300" y="310" width="200" height="48" rx="6" fill="#faf5ff" stroke="#c084fc" stroke-width="1.3" filter="url(#sh)"/>
    <text x="400" y="329" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#7c3aed">NAT Gateway</text>
    <!-- EIP badge on NAT -->
    <rect x="340" y="338" width="120" height="16" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="400" y="350" text-anchor="middle" font-family="monospace" font-size="8" font-weight="500" fill="#b45309">EIP az-a</text>

    <!-- Arrow: Public RT -> Public Subnet AZ-a -->
    <line x1="500" y1="216" x2="315" y2="216" stroke="#16a34a" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="315" y1="216" x2="200" y2="285" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-g)"/>

    <!-- Private RT AZ-a -->
    <rect x="110" y="425" width="200" height="30" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="210" y="445" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="500" fill="#dc2626">Private RT AZ-a &mdash; 0.0.0.0/0 &rarr; NAT</text>

    <!-- Arrow: NAT AZ-a -> Private RT AZ-a -->
    <line x1="400" y1="358" x2="210" y2="358" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="210" y1="358" x2="210" y2="425" stroke="#dc2626" stroke-width="1" marker-end="url(#arr-r)"/>

    <!-- Private Subnet AZ-a -->
    <rect x="110" y="475" width="200" height="110" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="210" y="500" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#991b1b">Private Subnet AZ-a</text>
    <text x="210" y="516" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#dc2626">10.100.10.0/24</text>
    <rect x="135" y="530" width="150" height="30" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" filter="url(#sh)"/>
    <text x="210" y="550" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9.5" font-weight="500" fill="#991b1b">private-ec2</text>

    <!-- Arrow: Private RT -> Private Subnet AZ-a -->
    <line x1="210" y1="455" x2="210" y2="475" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-r)"/>

    <!-- =============== AZ-b =============== -->
    <rect x="660" y="255" width="450" height="340" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
    <text x="680" y="275" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#94a3b8">AZ-b</text>

    <!-- Public Subnet AZ-b -->
    <rect x="680" y="285" width="410" height="120" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
    <text x="700" y="305" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#15803d">Public Subnet 10.100.1.0/24</text>

    <!-- public-ec2 AZ-b -->
    <rect x="700" y="315" width="140" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" filter="url(#sh)"/>
    <text x="770" y="332" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#15803d">public-ec2</text>
    <text x="770" y="347" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7.5" fill="#4ade80">SG: allow_all</text>

    <!-- NAT Gateway AZ-b (inside public subnet) -->
    <rect x="870" y="310" width="200" height="48" rx="6" fill="#faf5ff" stroke="#c084fc" stroke-width="1.3" filter="url(#sh)"/>
    <text x="970" y="329" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#7c3aed">NAT Gateway</text>
    <!-- EIP badge on NAT -->
    <rect x="910" y="338" width="120" height="16" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="970" y="350" text-anchor="middle" font-family="monospace" font-size="8" font-weight="500" fill="#b45309">EIP az-b</text>

    <!-- Arrow: Public RT -> Public Subnet AZ-b -->
    <line x1="700" y1="216" x2="885" y2="216" stroke="#16a34a" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="885" y1="216" x2="770" y2="285" stroke="#16a34a" stroke-width="1.2" marker-end="url(#arr-g)"/>

    <!-- Private RT AZ-b -->
    <rect x="870" y="425" width="200" height="30" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="970" y="445" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="500" fill="#dc2626">Private RT AZ-b &mdash; 0.0.0.0/0 &rarr; NAT</text>

    <!-- Arrow: NAT AZ-b -> Private RT AZ-b -->
    <line x1="970" y1="358" x2="970" y2="425" stroke="#dc2626" stroke-width="1" marker-end="url(#arr-r)"/>

    <!-- Private Subnet AZ-b -->
    <rect x="870" y="475" width="200" height="110" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
    <text x="970" y="500" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#991b1b">Private Subnet AZ-b</text>
    <text x="970" y="516" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#dc2626">10.100.11.0/24</text>
    <rect x="895" y="530" width="150" height="30" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2" filter="url(#sh)"/>
    <text x="970" y="550" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9.5" font-weight="500" fill="#991b1b">private-ec2</text>

    <!-- Arrow: Private RT -> Private Subnet AZ-b -->
    <line x1="970" y1="455" x2="970" y2="475" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arr-r)"/>

    <!-- Cross-AZ intra-VPC -->
    <line x1="250" y1="334" x2="700" y2="334" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="475" y="329" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#94a3b8">intra-VPC</text>

    <!-- Legend -->
    <rect x="360" y="620" width="480" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="600" y="640" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#475569">Legend</text>

    <rect x="380" y="652" width="10" height="10" rx="2" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="396" y="661" font-family="system-ui,sans-serif" font-size="8" fill="#64748b">Public</text>

    <rect x="450" y="652" width="10" height="10" rx="2" fill="#fee2e2" stroke="#dc2626" stroke-width="0.8"/>
    <text x="466" y="661" font-family="system-ui,sans-serif" font-size="8" fill="#64748b">Private</text>

    <rect x="530" y="652" width="10" height="10" rx="2" fill="#faf5ff" stroke="#c084fc" stroke-width="0.8"/>
    <text x="546" y="661" font-family="system-ui,sans-serif" font-size="8" fill="#64748b">NAT Gateway</text>

    <rect x="640" y="652" width="10" height="10" rx="2" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="656" y="661" font-family="system-ui,sans-serif" font-size="8" fill="#64748b">Elastic IP</text>

    <rect x="730" y="652" width="10" height="10" rx="2" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.8"/>
    <text x="746" y="661" font-family="system-ui,sans-serif" font-size="8" fill="#64748b">IGW</text>
  </svg>
</body>
</html>
